<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Login - AgriBibit</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--text:#0f172a;--muted:#64748b;--field:#f8fafc;--border:#e2e8f0;--brand:#059669;--brand-dark:#047857;--accent:#2dd4bf;--err:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1210;--text:#f1f5f9;--muted:#94a3b8;--field:#111c18;--border:#1f2e28}}
:root[data-theme=dark]{--bg:#0b1210;--text:#f1f5f9;--muted:#94a3b8;--field:#111c18;--border:#1f2e28}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page{display:grid;grid-template-columns:1fr 1fr;min-height:100dvh}

/* Panel kiri */
.hero{position:relative;overflow:hidden;color:#fff;padding:32px 44px 48px;display:flex;flex-direction:column;justify-content:flex-start;
  background:#14532d url('assets/login.jpg') center/cover no-repeat} /* ganti nama file gambar di sini */
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.1) 35%,rgba(0,0,0,.65) 100%)}
.hero>*{position:relative}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo img{width:40px;height:40px;border-radius:11px;display:block}
.hero h2{font-size:clamp(32px,4.2vw,56px);line-height:1.1;font-weight:800;margin:auto 0;padding-bottom:12vh;letter-spacing:-.025em;max-width:11em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero h2 span{display:block;color:var(--accent);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:8px}

/* Panel kanan */
.panel{display:flex;flex-direction:column;justify-content:space-between;padding:clamp(32px,7vw,96px) clamp(24px,6vw,88px) 32px}
.form-wrap{margin:auto 0;width:100%;max-width:440px}
h1{font-size:34px;line-height:1.15;font-weight:800;margin:0 0 12px;letter-spacing:-.025em}
.sub{color:var(--muted);font-size:15px;line-height:1.65;margin:0 0 36px}
label{display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px}
.field{position:relative;margin-bottom:20px}
.field .ic{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}
input[type=text],input[type=password]{width:100%;height:52px;border:1px solid var(--border);background:var(--field);color:var(--text);
  border-radius:12px;padding:0 48px 0 46px;font:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s}
input:focus-visible{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,150,105,.2)}
.field.invalid input{border-color:var(--err)}
.eye{position:absolute;right:8px;top:50%;translate:0 -50%;border:0;background:none;padding:8px;color:var(--muted);cursor:pointer;border-radius:8px}
.eye svg{width:18px;height:18px;display:block}
.err{display:none;color:var(--err);font-size:13px;margin:-12px 0 16px}
.field.invalid+.err{display:block}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:24px}
.check{position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text);font-weight:500;text-transform:none;letter-spacing:0;font-size:14px;margin:0}
.check input{position:absolute;opacity:0}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);background:var(--field);display:grid;place-items:center}
.check input:checked+.box{background:var(--brand);border-color:var(--brand)}
.check input:checked+.box::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;rotate:-45deg;translate:0 -1px}
.link{color:var(--brand);font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline}
.btn,.bio{width:100%;border-radius:12px;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn{height:52px;border:0;background:var(--brand);color:#fff;font-size:15px;font-weight:700;transition:background .15s}
.btn:hover{background:var(--brand-dark)}
.btn:disabled{opacity:.7;cursor:progress}
.bio{height:46px;margin-top:14px;border:1px dashed var(--border);background:var(--field);color:var(--text);font-size:14px;font-weight:500}
.bio svg{width:16px;height:16px;color:var(--brand)}
:is(.eye,.link,.btn,.bio,.check input):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.msg{min-height:20px;font-size:14px;margin-top:14px;text-align:center}
.msg.ok{color:var(--brand)}.msg.bad{color:var(--err)}
.foot{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:36px}
.foot span{display:flex;align-items:center;gap:6px}
.foot svg{width:14px;height:14px;color:var(--brand)}

@media (max-width:820px){
  .page{grid-template-columns:1fr}
  .hero{min-height:240px;padding:24px 24px 28px}
  .hero h2{font-size:30px;padding-bottom:0;margin:32px 0 0}
  h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <section class="hero" aria-label="AgriBibit">
    <div class="logo">
      <img src="assets/logo.png" alt="" width="32" height="32">
      AgriBibit
    </div>
    <h2>Akses Bibit Unggulan &amp; Kelola <span>Pesananmu.</span></h2>
  </section>

  <section class="panel">
    <div class="form-wrap">
      <h1>Admin Login</h1>
      <p class="sub">Masuk ke akun super admin AgriBibit Anda untuk memantau pengiriman bibit dan berkonsultasi langsung.</p>

      <form id="f" novalidate>
        <label for="user">Email atau username</label>
        <div class="field">
          <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input type="text" id="user" autocomplete="username" placeholder="admin@agribibit.id" aria-describedby="eu">
        </div>
        <div class="err" id="eu">Isi email atau username.</div>

        <label for="pass">Kata sandi</label>
        <div class="field">
          <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="pass" autocomplete="current-password" aria-describedby="ep">
          <button type="button" class="eye" id="eye" aria-label="Tampilkan kata sandi">
            <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="err" id="ep">Isi kata sandi.</div>

        <div class="row">
          <label class="check"><input type="checkbox" id="remember" checked><span class="box"></span>Ingat saya</label>
          <a href="#" class="link">Lupa kata sandi?</a>
        </div>

        <button class="btn" id="submit" type="submit">
          <span>Masuk ke Dashboard</span>
          <svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="bio" id="bio" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 11v3a5 5 0 0 1-1 3M8 14a4 4 0 0 1 8-1M5 13a7 7 0 0 1 14-2M9 19a9 9 0 0 0 1.5 2M18 17a9 9 0 0 1-1 2"/></svg>
          Masuk dengan Biometrik / FaceID
        </button>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </form>
    </div>

    <div class="foot">
      <span><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg>Data Terenkripsi SSL 256-Bit</span>
      <span><svg viewBox="0 0 24 24" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>Anti Spam Terverifikasi</span>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const [user, pass, msg, btn] = ['user', 'pass', 'msg', 'submit'].map($);
const NEXT_PAGE = 'index.html';
const label = btn.querySelector('span');

const show = (text, type = '') => { msg.textContent = text; msg.className = 'msg ' + type; };
const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

// GANTI dengan request ke backend (fetch ke API login). Jangan simpan kredensial di JavaScript.
async function authenticate(username, password) {
  await new Promise(r => setTimeout(r, 900)); // simulasi jaringan
  if (username !== 'admin@agribibit.com' || password !== 'admin123') throw new Error('Email/username atau kata sandi salah.');
}

try { user.value = localStorage.getItem('agribibit_user') || ''; } catch {}

$('eye').onclick = () => {
  const hidden = pass.type === 'password';
  pass.type = hidden ? 'text' : 'password';
  $('eye').setAttribute('aria-label', hidden ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
};

// Hapus status error saat pengguna mengetik
[user, pass].forEach(i => i.addEventListener('input', () => {
  i.parentElement.classList.remove('invalid');
  i.removeAttribute('aria-invalid');
}));

$('f').onsubmit = async e => {
  e.preventDefault();
  show('');
  const empty = [user, pass].filter(i => !i.value.trim());
  [user, pass].forEach(i => {
    const bad = empty.includes(i);
    i.parentElement.classList.toggle('invalid', bad);
    bad ? i.setAttribute('aria-invalid', 'true') : i.removeAttribute('aria-invalid');
  });
  if (empty.length) return empty[0].focus();

  btn.disabled = true;
  label.textContent = 'Memproses...';
  try {
    await authenticate(user.value.trim(), pass.value);
    try { sessionStorage.setItem('agribibit_session', '1'); } catch {}
    store('agribibit_user', $('remember').checked ? user.value.trim() : null);
    show('Berhasil masuk. Mengalihkan ke dashboard...', 'ok');
    setTimeout(() => location.href = NEXT_PAGE, 600);
  } catch (err) {
    show(err.message, 'bad');
    btn.disabled = false;
    label.textContent = 'Masuk ke Dashboard';
  }
};

$('bio').onclick = () => show('Login biometrik perlu WebAuthn dan backend. Belum diaktifkan.');
</script>
</body>
</html>
